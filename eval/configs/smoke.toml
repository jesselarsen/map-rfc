# Smoke gate (plan P6): a few seconds of every scenario with real crypto.
# `cargo run -p map-sim --release -- eval/configs/smoke.toml` must finish in
# < 2 min, and the CSV hashes must equal eval/configs/smoke.golden
# (map-rs/sim/tests/golden.rs).

[[experiment]]
scenario = "f1"
name = "smoke-f1"
seeds = 3
[experiment.params]
n = 100
horizon_s = 600.0
[experiment.sweep]
alpha = [0.2]
policy = ["noverify", "riskaware", "map", "map_ra"]
whitewash_s = [0.0, 60.0]

[[experiment]]
scenario = "e2"
name = "smoke-e2"
seeds = 3
[experiment.params]
tasks_per_seed = 5
L = 1000
lambda_L = 1.0
[experiment.sweep]
c = [8, 0]
f_dishonest = [0.2]
arm = ["restart", "countersigned", "provider_only"]

[[experiment]]
scenario = "e1"
name = "smoke-e1"
seeds = 2
[experiment.params]
providers = 40
requesters = 30
rounds = 10
sybils_per_adv = 4
alpha = 0.2
[experiment.sweep]
attack = ["combined", "camouflage"]
arm = ["b1", "b2l", "ours", "ours_c", "a_prior"]
weights = ["w0", "w1", "w2"]

[[experiment]]
scenario = "e3a"
name = "smoke-e3a"
seeds = 2
[experiment.params]
n = 1000
queries = 50
[experiment.sweep]
a = [0.05]
filter = ["off", "on"]

[[experiment]]
scenario = "e3c"
name = "smoke-e3c"
seeds = 2
[experiment.params]
n = 1000
churn = 0.1
lookups = 50
[experiment.sweep]
f_malicious = [0.0, 0.3]
paths = [1, 3]

[[experiment]]
scenario = "e3d"
name = "smoke-e3d"
seeds = 2
[experiment.params]
horizon_s = 600.0
[experiment.sweep]
rho = [0.8]
ttl_s = [10.0, 600.0]

[[experiment]]
scenario = "e4"
name = "smoke-e4"
seeds = 2
[experiment.params]
L = 200
lambda_L = 1.0
[experiment.sweep]
c = [8, 32]
