[package]
name = "x402-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MAP pay:x402 settlement-method adapter: EIP-3009 authorization payloads + facilitator settle (draft-map-pay-01 §5.1)"

[dependencies]
map-core = { path = "../../crates/map-core" }
map-pay = { path = "../../crates/map-pay" }
sha2.workspace = true

# Real x402 settlement deps (FR-1) — behind `real-x402`, default OFF so the
# workspace default tree gains ZERO external deps. This gate holds the
# workspace's FIRST non-Ed25519 crypto dependency (`k256`, secp256k1/ECDSA)
# plus keccak (`sha3`) for EIP-712 hashing, facilitator HTTP (`ureq`), and
# JSON for the facilitator API bodies (`serde_json`). The always-on path
# (codec, nonce, flows, canned impls) touches none of these.
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"], optional = true }
sha3 = { version = "0.10", optional = true }
# `json` for send_json/into_json; default TLS retained so a real facilitator
# can be reached over HTTPS.
ureq = { version = "2", features = ["json"], optional = true }
serde_json = { version = "1", optional = true }

[features]
real-x402 = ["dep:k256", "dep:sha3", "dep:ureq", "dep:serde_json"]
