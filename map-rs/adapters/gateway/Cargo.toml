[package]
name = "gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MAP federation gateway adapter: provenance labeling and zone tightening (draft-map-ops-01 §5)"

[dependencies]
map-discovery = { path = "../../crates/map-discovery" }
map-identity = { path = "../../crates/map-identity" }
map-core = { path = "../../crates/map-core" }
map-tasks = { path = "../../crates/map-tasks" }
map-taskrun = { path = "../../crates/map-taskrun" }
# For the InferenceBackend trait + OllamaExecutor/result_to_chunks (TASK-013).
# The gateway fronts the same backend seam Ollama does; this dep is acyclic
# (ollama-provider → map-taskrun, gateway → both). A future cleanup could move
# InferenceBackend to a shared crate (TASK-016 §4) — reported, not done here.
ollama-provider = { path = "../ollama-provider" }
# The x402 payer loop for the upstream leg (TASK-025; always-on seams only —
# the default build stays zero-external-dep, real HTTP rides x402-adapter's
# own `real-x402` feature).
x402-adapter = { path = "../x402-adapter" }

[dev-dependencies]
map-session = { path = "../../crates/map-session" }
map-trust = { path = "../../crates/map-trust" }
map-pay = { path = "../../crates/map-pay" }
