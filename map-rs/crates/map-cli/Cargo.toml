[package]
name = "map-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MAP command-line tooling: keygen, projection-rebuild demo, TCP interop peer"

[[bin]]
name = "map-cli"
path = "src/main.rs"

# The v1 demos (rfc-title-o-matic, serve-ollama, x402-demo,
# x402-gateway-demo) and the libp2p task/pay interop cells were retired in the
# accountability-layer rework (P2; still at tag map-v1-ietf). The A2A
# provider/requester demo returns in P4.

[dependencies]
map-core = { path = "../map-core" }
map-identity = { path = "../map-identity" }
map-session = { path = "../map-session" }
map-trust = { path = "../map-trust" }
sha2.workspace = true
hex.workspace = true
getrandom.workspace = true
